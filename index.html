<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VELTRIX | Mine TON</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app-loader">
    <div class="loader-container">
        <div class="loader-card">
            <img src="https://i.ibb.co/B5z8x1vJ/afb301036766.jpg" class="loader-logo" alt="VELTRIX">
            <div class="loader-brand">
                <h2>VELTRIX</h2>
                <p>Mine TON with Power</p>
            </div>
            <div class="loader-progress-container">
                <div class="loader-progress-bar" id="loader-progress-bar"></div>
            </div>
            <div class="loader-stats">
                <span id="loader-percent" class="loader-percent">0%</span>
            </div>
            <div class="loader-tip" id="loader-tip">
                <i class="fas fa-lightbulb"></i>
                <span>Earn more Power to increase mining rate</span>
            </div>
            <div class="loader-error" id="loader-error"></div>
        </div>
    </div>
</div>

<div id="app" style="display:none;">
    <header class="app-header">
        <div class="header-top">
            <div class="user-info">
                <div class="avatar-wrapper">
                    <img id="user-photo" class="user-avatar" src="https://i.ibb.co/XxXhyZYf/file-000000006f8c720e9ab4c76b6e560062.png">
                    <div class="avatar-badge level-badge" id="user-level-badge">1</div>
                </div>
                <div class="user-details">
                    <span id="user-name" class="user-name">User</span>
                    <div class="user-level"><i class="fas fa-crown"></i> <span id="user-level-text">Level</span> <span id="user-level">1</span></div>
                </div>
            </div>
            <div class="header-actions">
                <button id="lang-btn" class="header-icon-btn lang-btn"><span id="current-flag">🇬🇧</span></button>
                <button id="support-btn" class="header-icon-btn"><i class="fas fa-headset"></i></button>
            </div>
        </div>
    </header>

    <div id="lang-menu" class="lang-menu" style="display:none;">
        <div class="lang-menu-content">
            <button class="lang-option" data-lang="en" data-flag="🇬🇧">English</button>
            <button class="lang-option" data-lang="es" data-flag="🇪🇸">Español</button>
            <button class="lang-option" data-lang="fa" data-flag="🇮🇷">فارسی</button>
            <button class="lang-option" data-lang="tr" data-flag="🇹🇷">Türkçe</button>
            <button class="lang-option" data-lang="ar" data-flag="🇸🇦">العربية</button>
        </div>
    </div>

    <main id="main-content">
        <div id="mining-page" class="page active"></div>
        <div id="earn-page" class="page"></div>
        <div id="team-page" class="page"></div>
        <div id="withdraw-page" class="page"></div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-page="mining-page"><i class="fas fa-microchip"></i><span id="nav-mining">Mining</span></button>
        <button class="nav-btn" data-page="earn-page"><i class="fas fa-coins"></i><span id="nav-earn">Earn</span></button>
        <button class="nav-btn" data-page="team-page"><i class="fas fa-users"></i><span id="nav-team">Team</span></button>
        <button class="nav-btn" data-page="withdraw-page"><i class="fas fa-wallet"></i><span id="nav-withdraw">Withdraw</span></button>
    </nav>
</div>

<div id="claim-modal" class="modal" style="display:none;">
    <div class="modal-content glass-modal">
        <div class="modal-header">
            <h3 id="claim-title"><i class="fas fa-gift"></i> Claim Mining Rewards</h3>
            <button class="modal-close" id="close-claim-modal">&times;</button>
        </div>
        <div class="modal-body" style="text-align:center">
            <div class="reward-amount" id="claim-reward-amount">0.00000000 TON</div>
            <button id="confirm-claim-btn" class="confirm-ad-btn" style="width:100%">Claim Rewards</button>
        </div>
    </div>
</div>

<div id="tasks-info-modal" class="modal" style="display:none;">
    <div class="modal-content glass-modal">
        <div class="modal-header"><h3><i class="fas fa-globe"></i> <span id="partner-info-title">Social Tasks</span></h3><button class="modal-close" id="close-tasks-info">&times;</button></div>
        <div class="modal-body">
            <p id="partner-info-text1"><i class="fas fa-plus-circle" style="color:#6C63FF;margin-right:8px"></i> You can add task by support</p>
            <p id="partner-info-text2"><i class="fas fa-handshake" style="color:#6C63FF;margin-right:8px"></i> You can cooperate with us</p>
            <p id="partner-info-text3"><i class="fas fa-headset" style="color:#6C63FF;margin-right:8px"></i> Contact support for details</p>
            <button id="contact-support-modal" class="support-btn"><i class="fas fa-headset"></i> <span id="contact-support-btn">Contact Support</span></button>
        </div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
